<style>
:root{
  --granate:#A3002F; --granate-claro:#F7E4E9;
  --estado:#35577A; --estado-claro:#E3EBF3;
  --clm:#B4621B; --clm-claro:#FBF1E7;
  --verde:#25695C; --verde-claro:#E1EFEB;
  --rojo:#B3261E; --rojo-claro:#FBE9E7;
  --tinta:#2A2125; --gris:#6C6266; --linea:#DED6D9; --papel:#FFFFFF; --fondo:#F6F3F4;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-cuerpo:"IBM Plex Sans",Arial,Helvetica,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--fondo);color:var(--tinta);font-family:var(--f-cuerpo);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:20px;padding:12px 24px;background:var(--papel);border-bottom:1px solid var(--linea);flex-wrap:wrap}
.volver{font:600 13px var(--f-cuerpo);color:var(--granate);text-decoration:none;border:1px solid var(--granate);border-radius:999px;padding:4px 11px}
.volver:hover{background:var(--granate);color:#fff}
.marca{font-family:var(--f-disp);font-weight:700;color:var(--granate);font-size:15px;letter-spacing:.02em}
.marca span{color:var(--gris);font-weight:500}
nav.puntos{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav.puntos button{font:500 13px var(--f-cuerpo);border:1px solid var(--linea);background:var(--papel);color:var(--gris);border-radius:999px;padding:5px 11px;cursor:pointer}
nav.puntos button[aria-current="step"]{background:var(--granate);border-color:var(--granate);color:#fff}
button:focus-visible{outline:3px solid var(--clm);outline-offset:2px}
main{flex:1;display:grid;grid-template-columns:minmax(280px,360px) 1fr;min-height:0}
aside{padding:28px 26px 20px;display:flex;flex-direction:column;gap:12px;background:var(--papel);border-right:1px solid var(--linea);overflow:auto}
.num{font-family:var(--f-disp);font-weight:600;color:var(--granate);font-size:15px;letter-spacing:.06em;text-transform:uppercase}
aside h1{font-family:var(--f-disp);font-weight:700;font-size:38px;line-height:1.04;margin:0;text-wrap:balance}
.pregunta{font-size:19px;font-style:italic;color:var(--granate);margin:0}
.cuerpo{font-size:16px;line-height:1.55;margin:0;max-width:62ch}
.fuente{font-size:12.5px;color:var(--gris);margin-top:auto;border-top:1px solid var(--linea);padding-top:10px;line-height:1.45}
.ctl{display:flex;gap:8px;align-items:center}
.ctl button{font:600 14px var(--f-cuerpo);border:1px solid var(--granate);background:var(--papel);color:var(--granate);border-radius:6px;padding:8px 14px;cursor:pointer}
.ctl button.prim{background:var(--granate);color:#fff}
.ctl button:disabled{opacity:.35;cursor:default}
.marco{position:relative;min-height:0;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0}

/* Escaleras */
.cab{position:absolute;top:22px;font:700 17px var(--f-disp);letter-spacing:.02em}
.cab small{font:500 13px var(--f-cuerpo);color:var(--gris);margin-left:6px}
#cabE{left:40px;color:var(--estado)} #cabA{left:560px;color:var(--clm)}
.p{position:absolute;height:60px;border-radius:8px;border:1px solid;text-align:left;padding:7px 12px;font:inherit;color:var(--tinta);cursor:default;transition:opacity 400ms,box-shadow 300ms,transform 300ms,background 300ms}
.p b{display:block;font:700 15.5px var(--f-disp)}
.p span{display:block;font-size:12.5px;color:var(--gris);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p.e{background:var(--estado-claro);border-color:#B9CBDD}
.p.a{background:var(--clm-claro);border-color:#E8C9A8}
.p.c{background:#EEEAEC;border-color:#D3CBCF;border-style:dashed}
.p.f{background:var(--papel);border-color:#D3CBCF;border-style:dotted}
.clic .p{cursor:pointer}
.clic .p:hover{box-shadow:0 0 0 2px var(--granate)}
.p.sel{box-shadow:0 0 0 3px var(--granate),0 8px 18px rgba(60,20,30,.14)}
.p.ok{box-shadow:0 0 0 3px var(--verde)}
.p.mal{box-shadow:0 0 0 3px var(--rojo);animation:sacude 380ms}
@keyframes sacude{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.p.tenue{opacity:.28}
.p.foco{box-shadow:0 0 0 3px var(--granate)}
.tag{position:absolute;right:8px;top:7px;font:600 12px var(--f-cuerpo);border-radius:999px;padding:3px 9px;color:#fff;opacity:0;transition:opacity 400ms}
.tag.v{background:var(--verde)} .tag.r{background:var(--rojo)}
.tag.on{opacity:1}
svg.flechas{position:absolute;left:0;top:0;width:1000px;height:640px;pointer-events:none;overflow:visible}
svg .g{opacity:0;transition:opacity 500ms}
svg .g.on{opacity:1}

/* Panel inferior */
.panel{position:absolute;left:40px;top:482px;width:920px;height:152px;background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:12px 16px;font-size:14.5px;line-height:1.45;overflow:hidden}
.panel h3{margin:0 0 4px;font:700 17px var(--f-disp)}
.panel .meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;margin-top:4px}
.panel .meta b{color:var(--gris);font-weight:600}
.doc{display:flex;gap:14px;align-items:flex-start;padding-right:150px}
.doc .n{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--granate);color:#fff;font:700 18px var(--f-disp);display:grid;place-items:center}
.doc .t{font:600 16px var(--f-cuerpo);line-height:1.35}
.res{margin-top:6px;font-size:13.5px}
.res.ok b{color:var(--verde)} .res.mal b{color:var(--rojo)}
.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btns button{font:600 13.5px var(--f-cuerpo);border:1px solid var(--granate);background:var(--papel);color:var(--granate);border-radius:6px;padding:6px 12px;cursor:pointer}
.btns button.prim{background:var(--granate);color:#fff}
.btns button.ok{background:var(--verde);border-color:var(--verde);color:#fff}
.btns button.mal{background:var(--rojo);border-color:var(--rojo);color:#fff}
.btns button:disabled{cursor:default}
.marcador{position:absolute;right:16px;top:12px;font:600 13px var(--f-cuerpo);color:var(--gris)}

@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{border-right:0;border-bottom:1px solid var(--linea);padding:18px 16px}
  aside h1{font-size:30px}
  .marco{min-height:62vw}
  header{padding:10px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms !important;animation:none !important}}
</style>

  ];

  var s=0, iDoc=0, aciertos=0, intento=0, resueltos=[], iCaso=0;
  var nav=document.querySelector("nav.puntos");
  escenas.forEach(function(e,i){var x=document.createElement("button");x.type="button";x.textContent=(i+1)+". "+e.t;x.addEventListener("click",function(){ir(i)});nav.appendChild(x)});

  function limpiar(){
    document.querySelectorAll(".p").forEach(function(b){b.classList.remove("sel","ok","mal","tenue","foco");var t=b.querySelector(".tag");t.className="tag";t.textContent=""});
    ["gBase","gJer","gPre"].forEach(function(g){$(g).classList.remove("on")});
  }
  function tag(k,txt,cl){var t=$("p_"+k).querySelector(".tag");t.textContent=txt;t.className="tag on "+cl}
  function tenue(lista){Object.keys(P).forEach(function(k){if(lista.indexOf(k)<0)$("p_"+k).classList.add("tenue")})}

  function ficha(k){
    var d=P[k];
    $("panel").innerHTML="<h3>"+d.n+"</h3><div>"+d.reg+"</div><div class=\"meta\"><span><b>Quién la aprueba:</b> "+d.org+"</span><span><b>Dónde se publica:</b> "+d.bol+"</span></div>";
  }
  function pintarDoc(){
    if(iDoc>=DOCS.length){
      $("panel").innerHTML="<h3>Clasificación terminada</h3><div>Has acertado "+aciertos+" de "+DOCS.length+" a la primera. Repasa los que fallaste: casi siempre son el Estatuto de Autonomía, el Estatuto de los Trabajadores, las instrucciones o el anteproyecto.</div><div class=\"btns\"><button type=\"button\" class=\"prim\" id=\"reini\">Volver a empezar</button></div>";
      $("reini").addEventListener("click",function(){iDoc=0;aciertos=0;intento=0;limpiar();pintarDoc()});
      return;
    }
    var d=DOCS[iDoc];
    $("panel").innerHTML="<span class=\"marcador\">"+(iDoc+1)+" de "+DOCS.length+" · aciertos a la primera: "+aciertos+"</span><div class=\"doc\"><div class=\"n\">"+(iDoc+1)+"</div><div><div class=\"t\">"+d.t+"</div><div class=\"res\" id=\"res\">Pulsa su peldaño en la escalera.</div></div></div>";
  }
  function pulsar(k){
    if(s===1){limpiar();$("p_"+k).classList.add("sel");ficha(k);return}
    if(s!==2||iDoc>=DOCS.length)return;
    var d=DOCS[iDoc]; limpiar();
    if(d.ok.indexOf(k)>=0){
      if(intento===0)aciertos++;
      $("p_"+k).classList.add("ok");
      $("res").className="res ok";
      $("res").innerHTML="<b>Correcto.</b> "+d.r+" · "+d.o+(d.b!=="—"?" · "+d.b:"")+(d.x?". "+d.x:".");
      $("res").innerHTML+=" <button type=\"button\" id=\"sigD\" style=\"font:600 12.5px var(--f-cuerpo);border:1px solid var(--granate);background:var(--granate);color:#fff;border-radius:5px;padding:2px 9px;cursor:pointer\">Siguiente documento →</button>";
      $("sigD").addEventListener("click",function(){iDoc++;intento=0;limpiar();pintarDoc()});
      iDocBloq=true;
    } else {
      intento++;
      var el=$("p_"+k); void el.offsetWidth; el.classList.add("mal");
      $("res").className="res mal";
      $("res").innerHTML="<b>No es ese peldaño.</b> Piensa quién lo aprueba"+(intento>=2?": "+d.o+".":".")+(intento>=3?" <button type=\"button\" id=\"versol\" style=\"font:600 12.5px var(--f-cuerpo);border:1px solid var(--granate);background:#fff;color:var(--granate);border-radius:5px;padding:2px 8px;cursor:pointer\">Ver la solución</button>":"");
      if($("versol"))$("versol").addEventListener("click",function(){pulsar(d.ok[0])});
    }
  }
  var iDocBloq=false;

  function pintarCaso(){
    var c=CASOS[iCaso]; limpiar(); c.p.forEach(function(k){$("p_"+k).classList.add("foco")}); tenue(c.p);
    var h="<span class=\"marcador\">Caso "+(iCaso+1)+" de "+CASOS.length+"</span><div style=\"padding-right:110px\">"+c.t+"</div><div class=\"btns\" id=\"crit\">";
    CRIT.forEach(function(k){h+="<button type=\"button\" data-v=\""+k+"\">"+k+"</button>"});
    h+="</div><div class=\"res\" id=\"resC\"></div>";
    $("panel").innerHTML=h;
    $("crit").querySelectorAll("button").forEach(function(b){b.addEventListener("click",function(){
      var v=b.getAttribute("data-v");
      if(v===c.ok){
        $("crit").querySelectorAll("button").forEach(function(x){x.disabled=true});
        b.className="ok"; $("resC").className="res ok";
        $("resC").innerHTML="<b>"+c.ok+".</b> "+c.x+(iCaso<CASOS.length-1?" <button type=\"button\" id=\"sigC\" style=\"font:600 12.5px var(--f-cuerpo);border:1px solid var(--granate);background:var(--granate);color:#fff;border-radius:5px;padding:2px 9px;cursor:pointer\">Siguiente caso →</button>":" <b style=\"color:var(--gris)\">Último caso.</b>");
        if($("sigC"))$("sigC").addEventListener("click",function(){iCaso++;pintarCaso()});
      } else { b.className="mal"; b.disabled=true; $("resC").className="res mal"; $("resC").innerHTML="<b>No.</b> Fíjate en qué normas están implicadas: ¿están en la misma escalera?"; }
    })});
  }

  function pintar(){
    var e=escenas[s]; document.body.setAttribute("data-s",s);
    $("num").textContent="Escena "+(s+1)+" de "+escenas.length;
    $("tit").textContent=e.t;$("preg").textContent=e.p;$("cuerpo").textContent=e.c;$("fuente").textContent="Fuente: "+e.f;
    $("ant").disabled=s===0;$("sig").disabled=s===escenas.length-1;
    nav.querySelectorAll("button").forEach(function(x,i){if(i===s)x.setAttribute("aria-current","step");else x.removeAttribute("aria-current")});
    $("stage").classList.toggle("clic",s===1||s===2);
    limpiar();
    if(s===0){$("gBase").classList.add("on");$("panel").innerHTML="<h3>Cómo se lee</h3><div>Las flechas discontinuas no son escalones: indican que el Estado reparte la competencia (Constitución) y fija las bases que la comunidad desarrolla (reales decretos → decretos). Una ley autonómica no está «por debajo» de una ley orgánica estatal.</div>";}
    if(s===1){$("panel").innerHTML="<h3>Pulsa un peldaño</h3><div>Verás quién aprueba esa norma, qué regula en la Formación Profesional y dónde se publica.</div>";}
    if(s===2){pintarDoc();}
    if(s===3){$("gJer").classList.add("on");tag("e2","LOE, art. 41.3.b)","v");tag("e3","RD 556/2012, art. 13.2 ✕","r");tenue(["e2","e3"]);
      $("panel").innerHTML="<h3>Gana la norma de rango superior del mismo ordenamiento</h3><div>Las dos normas son estatales, así que se comparan por rango. La reforma de la LOE (2020) es además posterior al real decreto (2012), pero el argumento decisivo es la jerarquía: un real decreto posterior que contradijera la LOE tampoco ganaría por ser más reciente. El RD 659/2023 (art. 112.1.a) reitera el acceso directo.</div>";}
    if(s===4){$("gPre").classList.add("on");tag("e2","LO 3/2022, art. 55","v");tag("e3","RD 659/2023, art. 9","v");tag("a2","Ley 7/2010, art. 70.3 ✕","r");tenue(["e2","e3","a2"]);
      $("panel").innerHTML="<h3>No es rango: es competencia</h3><div>La ley regional no está derogada y su art. 70.3 sigue publicado, pero en ese apartado cede ante la regulación básica estatal de la formación en empresa. La propia Junta aplica ya el modelo nuevo en el Decreto 79/2024 y la Orden 204/2024, que regulan la formación en empresa y no el módulo. Error típico: clasificarlo como jerarquía.</div>";}
    if(s===5){iCaso=0;pintarCaso();}
  }
  function ir(n){s=Math.max(0,Math.min(escenas.length-1,n));pintar()}
  $("sig").addEventListener("click",function(){ir(s+1)});
  $("ant").addEventListener("click",function(){ir(s-1)});
  document.addEventListener("keydown",function(ev){
    if(ev.target&&ev.target.tagName==="BUTTON"&&(ev.key===" "||ev.key==="Enter"))return;
    if(ev.key==="ArrowRight"||ev.key==="PageDown"){ev.preventDefault();ir(s+1)}
    else if(ev.key==="ArrowLeft"||ev.key==="PageUp"){ev.preventDefault();ir(s-1)}
    else if(ev.key==="f"||ev.key==="F"){try{if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(function(){})}else{document.exitFullscreen()}}catch(e){}}
  });
  function escalar(){var m=$("marco"),stg=$("stage"),w=m.clientWidth,h=m.clientHeight;if(!w||!h)return;var k=Math.min(w/1000,h/640)*.96;stg.style.transform="translate("+((w-1000*k)/2)+"px,"+((h-640*k)/2)+"px) scale("+k+")"}
  window.addEventListener("resize",escalar);if(window.ResizeObserver)new ResizeObserver(escalar).observe($("marco"));
  pintar();escalar();
})();
</script>
</body>
</html>
